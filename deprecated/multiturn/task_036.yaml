# Multi-turn variant of task_036.
#
# `private_facts` are what the customer does NOT volunteer. BenchFlow's
# DocumentNudgeUser releases one only when the agent's previous turn contains a
# question AND mentions that fact's key words (contracts/user.py:_asks_for_fact),
# so each key must be phrased the way an agent would naturally ask for it.
#
# The persona is what the customer says up front. Everything withheld below must
# be absent from it, or there is nothing left to ask for and the conversation
# collapses to a single turn.

# What the agent sees as the customer's opening message. This REPLACES the tau2
# scenario in the briefing: that scenario spells out the withheld details, so
# showing it to the agent would defeat the whole point of withholding them.
opening: |
  Hi, I need some help. I was looking at my credit card statement and my balance
  seems higher than it should be. Can you show me my recent transactions? I want
  to see what's been charged to my Silver Rewards Card.

  My name is Fatima Al-Hassan, my phone number is 313-555-0246 and my email is
  coffeelover_fati@protonmail.com.

persona: |
  You are Fatima Al-Hassan, a small business owner in Detroit with a Rho-Bank
  Silver Rewards Card.

  You called because your statement balance looks higher than it should be, and
  you want to review your recent transactions. Two charges are not yours —
  "Electronics Express Miami" ($487.99) and "GamerZone LA" ($299.95). You have
  never shopped at either. You want the card cancelled and replaced.

  You give your name, phone number (313-555-0246) and email
  (coffeelover_fati@protonmail.com) when asked to verify your identity.

private_facts:
  shipping address: >-
    Please send the replacement to my work address, not home — I've had packages
    stolen at my apartment. It is 2500 Woodward Avenue, Suite 300, Detroit, MI
    48201.
  shipping speed: >-
    Yes please use expedited shipping, I want the new card as soon as possible
    given someone has my details.

# Rounds the conversation may run. Two facts plus the opening turn needs at
# least three; the budget allows headroom for the agent to ask in its own order.
nudge_budget: 6
